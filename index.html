<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конструктор документов — Typst</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Конструктор документов</h1>
      </header>

      <div class="template-row">
        <label for="template">Шаблон</label>
        <select id="template" class="tpl"></select>
      </div>

      <details class="docs" id="docs">
        <summary>Мои документы</summary>
        <div class="docs-body" id="docs-body"></div>
      </details>

      <nav id="steps" class="steps" aria-label="Разделы документа"></nav>

      <main id="step"></main>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="actions-secondary">
        <button id="save" type="button" class="btn btn-ghost">Сохранить документ</button>
      </div>

      <div id="actions" class="actions">
        <button id="back" type="button" class="btn btn-ghost">Назад</button>
        <button id="next" type="button" class="btn btn-primary">Далее</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
