<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конструктор документов — Typst</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <button id="home" type="button" class="home-btn" aria-label="К выбору шаблона" title="К выбору шаблона" hidden>←</button>
        <div class="brand" id="brand">
          <h1 id="brand-title">Выберите шаблон</h1>
          <p id="brand-subtitle">Готовые документы для заполнения</p>
        </div>
        <details class="tools-menu">
          <summary aria-label="Действия с данными" title="Действия с данными">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </summary>
          <div class="tools-popover">
            <button id="restart" type="button" class="tool-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Начать заново</span>
            </button>
            <button id="clear-data" type="button" class="tool-item destructive">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>
              <span>Удалить сохранённые данные</span>
            </button>
          </div>
        </details>
      </header>

      <p id="status" role="status" aria-live="polite" hidden></p>

      <section id="start-screen" class="start-screen">
        <div class="start-intro">
          <p class="eyebrow">Начните с выбора документа</p>
          <h2>Какой документ заполняем?</h2>
          <p>Выберите шаблон — заполнение можно будет продолжить позже.</p>
        </div>
        <div id="template-cards" class="template-cards" aria-label="Доступные шаблоны"></div>

        <details class="docs" id="docs">
          <summary>Мои документы</summary>
          <div class="docs-body" id="docs-body"></div>
        </details>
      </section>

      <section id="editor-screen" class="editor-screen" hidden>
        <div class="template-row">
          <label for="template">Шаблон</label>
          <select id="template" class="tpl"></select>
        </div>

        <div class="progress-row">
          <p id="progress" class="progress" aria-live="polite"></p>
          <nav id="steps" class="steps" aria-label="Разделы документа"></nav>
        </div>

        <main id="step"></main>

        <div class="actions-secondary">
          <button id="save" type="button" class="btn btn-ghost">Сохранить документ</button>
        </div>

        <div id="actions" class="actions">
          <button id="back" type="button" class="btn btn-ghost">Назад</button>
          <button id="next" type="button" class="btn btn-primary">Далее</button>
        </div>
      </section>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
